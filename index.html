<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Suivi de commande - Aniel Medical SHOP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f8fafc; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeInUp 0.5s ease-out; }
        .timeline-dot { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
        .timeline-line { width: 40px; height: 3px; border-radius: 2px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center">
                    <i class="bi bi-bag-check-fill text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-gray-800">Aniel Medical SHOP</h1>
                    <p class="text-xs text-gray-500">Suivi de commande</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenu principal -->
    <main class="flex-1 max-w-2xl mx-auto px-4 py-8 w-full">
        
        <!-- Écran de recherche -->
        <div id="searchScreen">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-blue-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i class="bi bi-box-seam text-blue-600 text-3xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Suivez votre commande</h2>
                <p class="text-gray-500">Entrez votre numéro de commande pour suivre son évolution</p>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Numéro de commande</label>
                <div class="flex gap-2">
                    <input type="text" id="orderIdInput" class="flex-1 rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-lg text-center font-mono tracking-wider" placeholder="ex: art28" autofocus>
                    <button id="searchBtn" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition shadow-sm flex items-center gap-2">
                        <i class="bi bi-search"></i> Suivre
                    </button>
                </div>
                <p id="errorMsg" class="text-red-500 text-sm mt-2 hidden"></p>
            </div>

            <div class="mt-6 text-center text-sm text-gray-400">
                <p><i class="bi bi-info-circle mr-1"></i> Le numéro de commande se trouve sur votre bon de commande</p>
            </div>
        </div>

        <!-- Écran de résultat -->
        <div id="resultScreen" class="hidden"></div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-4 mt-auto">
        <div class="max-w-2xl mx-auto px-4 text-center text-sm text-gray-500">
            <p>© 2024 Aniel Medical SHOP. Tous droits réservés.</p>
            <p class="mt-1">
                <i class="bi bi-whatsapp text-green-600 mr-1"></i> Contact : 
                <a href="https://wa.me/261000000000" class="text-blue-600 hover:underline">WhatsApp</a>
            </p>
        </div>
    </footer>

    <script>
        // ==================== CONFIGURATION GIST ====================
        const GIST_ID = "9fc099c832113b7764b85dc4e189a008";
        const GH_TOKEN = "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";
        const FILE_NAME = "aniel_db.json";
        const API_URL = `https://api.github.com/gists/${GIST_ID}`;

        let orders = [];
        let settings = {};

        // ==================== CHARGEMENT DES DONNÉES ====================
        async function loadData() {
            try {
                const response = await fetch(API_URL, {
                    headers: {
                        "Authorization": `Bearer ${GH_TOKEN}`,
                        "Accept": "application/vnd.github.v3+json"
                    }
                });
                if (response.ok) {
                    const gist = await response.json();
                    if (gist.files && gist.files[FILE_NAME] && gist.files[FILE_NAME].content) {
                        const content = gist.files[FILE_NAME].content.trim();
                        if (content) {
                            const db = JSON.parse(content);
                            orders = db.orders || [];
                            settings = db.settings || {};
                            return true;
                        }
                    }
                }
                return false;
            } catch (e) {
                console.error("Erreur de chargement:", e);
                return false;
            }
        }

        // ==================== FONCTIONS UTILITAIRES ====================
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
        }

        function formatDate(dateStr) {
            return dateStr ? new Date(dateStr).toLocaleDateString('fr-FR') : '';
        }

        // ==================== RECHERCHE ====================
        document.getElementById('searchBtn').addEventListener('click', async () => {
            const orderId = document.getElementById('orderIdInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (!orderId) {
                errorMsg.textContent = "Veuillez entrer un numéro de commande";
                errorMsg.classList.remove('hidden');
                return;
            }

            // Charger les données si pas encore fait
            if (orders.length === 0) {
                const loaded = await loadData();
                if (!loaded) {
                    errorMsg.textContent = "Service temporairement indisponible. Veuillez réessayer.";
                    errorMsg.classList.remove('hidden');
                    return;
                }
            }

            const order = orders.find(o => o.id.toLowerCase() === orderId.toLowerCase());
            if (!order) {
                errorMsg.textContent = "Aucune commande trouvée avec ce numéro. Vérifiez et réessayez.";
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');
            document.getElementById('searchScreen').classList.add('hidden');
            showOrderDetail(order);
        });

        document.getElementById('orderIdInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('searchBtn').click();
        });

        // ==================== AFFICHAGE DU DÉTAIL ====================
        function showOrderDetail(order) {
            const container = document.getElementById('resultScreen');
            container.classList.remove('hidden');

            // Statut global
            const visibleItems = order.items.filter(i => !i.hidden);
            const allLivré = visibleItems.every(i => i.status === "livré");
            const allRécupéré = visibleItems.every(i => i.status === "récupéré");
            const allDone = visibleItems.every(i => i.status === "livré" || i.status === "récupéré");
            const hasInDelivery = visibleItems.some(i => i.status === "en livraison");
            const hasReady = visibleItems.some(i => i.status === "prêt à livrer" || i.status === "prêt à récupérer");

            let globalStatus = "En cours";
            let globalStatusColor = "text-amber-600";
            if (hasInDelivery) { globalStatus = "En livraison"; globalStatusColor = "text-blue-600"; }
            if (allLivré) { globalStatus = "Livré"; globalStatusColor = "text-emerald-600"; }
            if (allRécupéré) { globalStatus = "Récupéré"; globalStatusColor = "text-emerald-600"; }
            if (allDone) { globalStatus = "Terminé"; globalStatusColor = "text-gray-600"; }

            // Items HTML
            let itemsHtml = '';
            visibleItems.forEach((item, idx) => {
                const statusCouture = item.coutureStatus === 'terminé' ? '✅ Terminé' : item.coutureStatus === 'en cours' ? '🔵 En cours' : '⏳ À faire';
                const statusBroderie = item.broderieStatus ? (item.broderieStatus === 'terminé' ? '✅ Terminé' : item.broderieStatus === 'en cours' ? '🔵 En cours' : '⏳ À faire') : '—';

                itemsHtml += `
                    <div class="bg-gray-50 rounded-lg p-4 animate-fade-in" style="animation-delay: ${idx * 0.1}s">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="w-7 h-7 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center text-sm font-bold">${idx + 1}</span>
                            <span class="font-semibold text-gray-800">${item.quantity}x ${item.productType} — Taille ${item.size}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-sm">
                            <div><span class="text-gray-500">Tissu :</span> ${item.fabricType}</div>
                            <div><span class="text-gray-500">Couleur :</span> ${item.color}</div>
                            <div><span class="text-gray-500">Style :</span> ${item.style}</div>
                            <div><span class="text-gray-500">Fermeture :</span> ${item.closure}</div>
                            ${item.persoText ? `<div class="col-span-2"><span class="text-gray-500">Broderie :</span> ${item.persoText}</div>` : ''}
                            <div class="col-span-2 mt-2 pt-2 border-t border-gray-200">
                                <span class="text-gray-500">Couture :</span> <span class="font-medium">${statusCouture}</span>
                                ${item.broderieStatus ? ` <span class="ml-4 text-gray-500">Broderie :</span> <span class="font-medium">${statusBroderie}</span>` : ''}
                            </div>
                        </div>
                    </div>`;
            });

            // Timeline
            const steps = ['Commande reçue', 'En préparation', 'Prêt', 'Livré'];
            let currentStep = 0;
            if (hasReady) currentStep = 1;
            if (hasInDelivery) currentStep = 2;
            if (allDone) currentStep = 3;
            if (allRécupéré) steps[3] = 'Récupéré';

            let timelineHtml = '';
            steps.forEach((label, i) => {
                const done = i <= currentStep;
                const current = i === currentStep;
                const bg = done ? (current ? 'bg-blue-600 text-white shadow-lg shadow-blue-200' : 'bg-emerald-500 text-white') : 'bg-gray-200 text-gray-500';
                const icon = done ? 'bi-check-lg' : 'bi-circle';
                timelineHtml += `
                    <div class="flex flex-col items-center">
                        <div class="timeline-dot ${bg}">${done && !current ? '<i class="bi bi-check-lg"></i>' : current ? '<i class="bi bi-arrow-repeat"></i>' : '<i class="bi bi-circle"></i>'}</div>
                        <span class="text-xs mt-2 font-medium ${done ? 'text-emerald-600' : current ? 'text-blue-600' : 'text-gray-500'}">${label}</span>
                    </div>`;
                if (i < steps.length - 1) {
                    timelineHtml += `<div class="timeline-line ${i < currentStep ? 'bg-emerald-500' : 'bg-gray-300'}"></div>`;
                }
            });

            const resteAPayer = (order.totalPrice || 0) + (order.shippingCost || 0) - (order.advance || 0);

            container.innerHTML = `
                <div class="animate-fade-in space-y-6">
                    <!-- En-tête commande -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
                        <div class="flex items-center justify-between mb-4">
                            <div>
                                <span class="text-xs text-gray-500">Commande</span>
                                <h2 class="text-xl font-bold text-gray-800 font-mono">${order.id}</h2>
                            </div>
                            <span class="text-lg font-bold ${globalStatusColor}">${globalStatus}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-3 text-sm">
                            <div><span class="text-gray-500">Client :</span> <strong>${escapeHtml(order.clientName)}</strong></div>
                            <div><span class="text-gray-500">Commandé le :</span> ${formatDate(order.orderDate)}</div>
                            <div><span class="text-gray-500">Livraison prévue :</span> ${formatDate(order.dueDate)}${order.dueTime !== 'aucun' ? ' à ' + order.dueTime : ''}</div>
                            <div><span class="text-gray-500">Zone :</span> ${order.deliveryZone} — ${order.deliveryPlace || '-'}</div>
                        </div>
                    </div>

                    <!-- Timeline -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
                        <h3 class="font-semibold text-gray-800 mb-4">Évolution</h3>
                        <div class="flex justify-center items-center gap-0">${timelineHtml}</div>
                    </div>

                    <!-- Articles -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
                        <h3 class="font-semibold text-gray-800 mb-4">Détail des articles</h3>
                        <div class="space-y-3">${itemsHtml}</div>
                    </div>

                    <!-- Paiement -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
                        <h3 class="font-semibold text-gray-800 mb-4">Récapitulatif</h3>
                        <div class="space-y-2 text-sm">
                            <div class="flex justify-between"><span class="text-gray-500">Sous-total articles</span><span class="font-medium">${(order.totalPrice || 0).toLocaleString()} Ar</span></div>
                            <div class="flex justify-between"><span class="text-gray-500">Frais de livraison</span><span class="font-medium">${(order.shippingCost || 0).toLocaleString()} Ar</span></div>
                            <div class="flex justify-between font-bold text-base pt-2 border-t border-gray-200"><span>TOTAL</span><span>${((order.totalPrice || 0) + (order.shippingCost || 0)).toLocaleString()} Ar</span></div>
                            <div class="flex justify-between text-red-600"><span>Avance versée</span><span>- ${(order.advance || 0).toLocaleString()} Ar</span></div>
                            <div class="flex justify-between font-bold text-lg text-blue-700 pt-2 border-t border-gray-200"><span>RESTE À PAYER</span><span>${resteAPayer.toLocaleString()} Ar</span></div>
                        </div>
                    </div>

                    <!-- Bouton nouvelle recherche -->
                    <button onclick="location.reload()" class="w-full py-3 border border-blue-500 text-blue-600 rounded-lg font-medium hover:bg-blue-50 transition">
                        <i class="bi bi-arrow-left mr-1"></i> Suivre une autre commande
                    </button>
                </div>`;
        }

        // Chargement initial silencieux
        loadData();
    </script>
</body>
</html>
