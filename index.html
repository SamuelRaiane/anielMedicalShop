<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Suivi de commande - Aniel Medical SHOP</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        figma: {
                            purple: '#6366F1',
                            pink: '#EC4899',
                            coral: '#F43F5E',
                            amber: '#F59E0B',
                            mint: '#10B981',
                            blue: '#3B82F6',
                            dark: '#0F172A',
                            light: '#F8FAFC',
                            teal: '#14B8A6'
                        }
                    },
                    boxShadow: {
                        'figma-sm': '0 2px 8px rgba(0, 0, 0, 0.04)',
                        'figma-md': '0 12px 34px rgba(99, 102, 241, 0.06)',
                        'figma-lg': '0 20px 40px rgba(15, 23, 42, 0.08)'
                    }
                }
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            min-height: 100vh;
            height: auto;
            overflow-x: hidden;
            overflow-y: auto !important;
        }
        
        body {
            background: linear-gradient(135deg, #F8FAFC 0%, #EEF2F6 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #0F172A;
            padding: 1rem;
            position: relative;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
        }
        
        /* Assurer que tout le contenu peut défiler */
        .app-wrapper {
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
            overflow-y: visible;
            min-height: calc(100vh - 2rem);
            display: flex;
            flex-direction: column;
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #6366F1 0%, #EC4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #6366F1 0%, #EC4899 100%);
        }
        
        .medical-gradient {
            background: linear-gradient(135deg, #0891B2 0%, #6366F1 100%);
        }
        
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-slide {
            animation: fadeSlideUp 0.4s ease-out;
        }
        
        /* Permettre le scrolling fluide sur mobile */
        .overflow-auto-mobile {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        /* Ajustements pour mobile */
        @media (max-width: 768px) {
            body {
                padding: 0.75rem;
            }
            
            .timeline-scroll {
                overflow-x: auto;
                padding-bottom: 0.5rem;
            }
            
            .timeline-scroll::-webkit-scrollbar {
                height: 3px;
            }
            
            .timeline-scroll::-webkit-scrollbar-track {
                background: #e2e8f0;
                border-radius: 10px;
            }
            
            .timeline-scroll::-webkit-scrollbar-thumb {
                background: #6366F1;
                border-radius: 10px;
            }
        }
        
        /* Scrollbar personnalisée */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    <!-- Header -->
    <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6 bg-white p-5 rounded-2xl shadow-figma-md border border-slate-100">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl medical-gradient flex items-center justify-center text-white shadow-lg shadow-teal-500/30">
                <i class="fa-solid fa-capsules text-sm"></i>
            </div>
            <div>
                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Suivi médical</span>
                <h1 class="text-lg font-extrabold text-figma-dark">
                    Aniel Medical <span class="gradient-text">SHOP</span>
                </h1>
            </div>
        </div>
        
        <div class="flex flex-wrap items-center gap-2">
            <div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[10px] font-bold bg-indigo-50 text-indigo-600 border border-indigo-100">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Premium
            </div>
            <button class="px-3 py-1.5 rounded-xl bg-figma-dark text-white text-[11px] font-semibold hover:bg-opacity-90 transition-all flex items-center gap-1.5">
                <i class="fa-solid fa-headset text-[10px]"></i> Support
            </button>
        </div>
    </header>

    <!-- Zone de recherche -->
    <div id="searchSection" class="mb-6">
        <div class="bg-white p-6 rounded-2xl shadow-figma-md border border-slate-100 text-center">
            <div class="w-16 h-16 rounded-xl medical-gradient flex items-center justify-center mx-auto mb-3 shadow-lg shadow-teal-500/20">
                <i class="fa-solid fa-magnifying-glass text-white text-xl"></i>
            </div>
            <h2 class="text-xl font-extrabold text-figma-dark mb-1">Suivi de commande</h2>
            <p class="text-slate-500 text-xs mb-5">Entrez votre numéro de commande</p>
            
            <div class="flex flex-col gap-3">
                <input type="text" id="orderIdInput" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100 transition-all text-center font-mono text-base" placeholder="Ex: ART28, MED45" autocomplete="off">
                <button id="searchBtn" class="gradient-bg text-white px-5 py-3 rounded-xl font-bold shadow-lg shadow-indigo-500/25 hover:shadow-xl transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-truck-fast"></i> Tracker ma commande
                </button>
            </div>
            
            <div id="errorMsg" class="text-red-500 text-xs mt-3 hidden bg-red-50 p-2 rounded-xl"></div>
            <div id="loadingMsg" class="text-indigo-600 text-xs mt-3 hidden items-center justify-center gap-2">
                <div class="w-4 h-4 border-2 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div> Recherche...
            </div>
            
            <div class="mt-5 pt-3 border-t border-slate-100">
                <p class="text-[10px] text-slate-400"><i class="fa-regular fa-credit-card mr-1"></i> Numéro sur votre confirmation</p>
            </div>
        </div>
    </div>

    <!-- Résultat -->
    <div id="resultContainer" class="hidden fade-slide"></div>

    <!-- Footer -->
    <footer class="mt-auto pt-8 text-center text-[10px] text-slate-400 pb-2">
        <p>© 2025 Aniel Medical SHOP — Solutions médicales professionnelles</p>
        <p class="mt-1"><a href="#" class="underline hover:text-indigo-500">Centre d'assistance</a> | <a href="#" class="underline hover:text-indigo-500">WhatsApp</a></p>
    </footer>
</div>

<script>
    // ==================== CONFIGURATION ====================
    const DATA_URL = "https://gist.githubusercontent.com/SamuelRaiane/9fc099c832113b7764b85dc4e189a008/raw/7212b4959ad4fd41aad48b57128ea09b2d3e0d5d/aniel_db.json";
    
    let orders = [];
    let dataLoaded = false;

    async function loadData() {
        if (dataLoaded) return true;
        try {
            const response = await fetch(DATA_URL, { cache: 'no-cache' });
            if (!response.ok) throw new Error();
            const text = await response.text();
            const db = JSON.parse(text);
            orders = db.orders || [];
            dataLoaded = true;
            return true;
        } catch(e) {
            console.error("Erreur:", e);
            return false;
        }
    }

    function formatDate(dateStr) {
        if (!dateStr) return 'Non spécifiée';
        const d = new Date(dateStr);
        return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function formatShortDate(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    async function performSearch() {
        const input = document.getElementById('orderIdInput');
        const orderId = input.value.trim();
        const errorDiv = document.getElementById('errorMsg');
        const loadingDiv = document.getElementById('loadingMsg');
        const searchSection = document.getElementById('searchSection');
        const resultContainer = document.getElementById('resultContainer');

        errorDiv.classList.add('hidden');
        if (!orderId) {
            errorDiv.textContent = "Veuillez entrer un numéro de commande";
            errorDiv.classList.remove('hidden');
            return;
        }

        loadingDiv.classList.remove('hidden');
        const loaded = await loadData();
        loadingDiv.classList.add('hidden');

        if (!loaded) {
            errorDiv.textContent = "Service indisponible. Réessayez.";
            errorDiv.classList.remove('hidden');
            return;
        }

        const order = orders.find(o => o.id.toLowerCase() === orderId.toLowerCase());
        if (!order) {
            errorDiv.textContent = `Aucune commande "${orderId}". Vérifiez le numéro.`;
            errorDiv.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            searchSection.classList.remove('hidden');
            return;
        }

        searchSection.classList.add('hidden');
        resultContainer.classList.remove('hidden');
        renderOrderMobile(order);
    }

    function renderOrderMobile(order) {
        const container = document.getElementById('resultContainer');
        
        const visibleItems = order.items.filter(i => !i.hidden);
        const allLivré = visibleItems.every(i => i.status === "livré");
        const allRécupéré = visibleItems.every(i => i.status === "récupéré");
        const allDone = allLivré || allRécupéré;
        const hasInDelivery = visibleItems.some(i => i.status === "en livraison");
        const hasReady = visibleItems.some(i => i.status === "prêt à livrer" || i.status === "prêt à récupérer");

        let globalStatusText = "En cours";
        let globalStatusBadge = "bg-amber-100 text-amber-700";
        let statusIcon = "fa-clock";
        if (hasReady) { globalStatusText = "Prêt"; globalStatusBadge = "bg-blue-100 text-blue-700"; statusIcon = "fa-box-open"; }
        if (hasInDelivery) { globalStatusText = "En livraison"; globalStatusBadge = "bg-indigo-100 text-indigo-700"; statusIcon = "fa-truck"; }
        if (allLivré) { globalStatusText = "Livré"; globalStatusBadge = "bg-emerald-100 text-emerald-700"; statusIcon = "fa-check-circle"; }
        if (allRécupéré) { globalStatusText = "Récupéré"; globalStatusBadge = "bg-emerald-100 text-emerald-700"; statusIcon = "fa-hand-peace"; }

        let stepPercent = 25;
        if (hasReady) stepPercent = 50;
        if (hasInDelivery) stepPercent = 75;
        if (allDone) stepPercent = 100;

        const orderDate = order.orderDate ? new Date(order.orderDate) : new Date();
        const deliveryDate = order.dueDate ? new Date(order.dueDate) : new Date(orderDate);
        deliveryDate.setDate(orderDate.getDate() + 3);

        // Timeline simplifiée pour mobile
        const steps = [
            { name: "Confirmée", icon: "fa-check-circle", completed: true },
            { name: "Préparée", icon: "fa-box", completed: hasReady || hasInDelivery || allDone },
            { name: "En transit", icon: "fa-truck", completed: hasInDelivery || allDone, active: hasInDelivery && !allDone },
            { name: allRécupéré ? "Récupérée" : "Livrée", icon: allRécupéré ? "fa-hand-peace" : "fa-house-chimney", completed: allDone }
        ];

        let timelineHtml = `<div class="flex items-center justify-between gap-1">`;
        steps.forEach((step, idx) => {
            let dotClass = "";
            let dotContent = "";
            if (step.completed) {
                dotClass = "bg-emerald-500 text-white";
                dotContent = `<i class="fa-solid fa-check text-[10px]"></i>`;
            } else if (step.active) {
                dotClass = "bg-indigo-600 text-white ring-2 ring-indigo-100";
                dotContent = `<i class="fa-solid ${step.icon} text-[10px] animate-pulse"></i>`;
            } else {
                dotClass = "bg-slate-200 text-slate-400";
                dotContent = `<i class="fa-regular fa-circle text-[8px]"></i>`;
            }
            timelineHtml += `
                <div class="flex flex-col items-center flex-1">
                    <div class="w-8 h-8 rounded-full ${dotClass} flex items-center justify-center text-xs border-2 border-white shadow-sm">
                        ${dotContent}
                    </div>
                    <span class="text-[9px] font-medium mt-1 ${step.active ? 'text-indigo-600' : (step.completed ? 'text-slate-700' : 'text-slate-400')}">${step.name}</span>
                </div>
            `;
            if (idx < steps.length - 1) {
                timelineHtml += `<div class="flex-1 h-1 bg-slate-100 rounded-full"><div class="h-1 ${step.completed ? 'gradient-bg' : 'bg-slate-200'} rounded-full" style="width: ${step.completed ? '100%' : '0%'}"></div></div>`;
            }
        });
        timelineHtml += `</div>`;

        // Articles
        let itemsHtml = '';
        visibleItems.forEach((item, idx) => {
            const coutureStatus = item.coutureStatus === 'terminé' ? '✅ Terminé' : (item.coutureStatus === 'en cours' ? '🔵 En cours' : '⏳ En attente');
            itemsHtml += `
                <div class="py-3 border-b border-slate-100 last:border-0">
                    <div class="flex items-start gap-3">
                        <div class="w-10 h-10 rounded-xl bg-teal-50 border border-teal-100 flex items-center justify-center flex-shrink-0 text-teal-600">
                            <i class="fa-solid fa-stethoscope text-sm"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex flex-wrap items-center justify-between gap-1">
                                <h4 class="text-sm font-bold text-slate-800">${item.quantity}x ${item.productType}</h4>
                                <span class="text-[10px] bg-slate-100 px-2 py-0.5 rounded-full">T.${item.size}</span>
                            </div>
                            <p class="text-[11px] text-slate-500">${item.fabricType} • ${item.color} • ${item.style}</p>
                            ${item.persoText ? `<p class="text-[10px] text-indigo-600 mt-1 truncate"><i class="fa-regular fa-message"></i> ${item.persoText.substring(0, 35)}</p>` : ''}
                            <div class="flex gap-2 mt-1 text-[10px] text-slate-500">
                                <span>🧵 ${coutureStatus}</span>
                                ${item.broderieStatus ? `<span>🪡 ${item.broderieStatus === 'terminé' ? '✅' : '🔵'}</span>` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });

        const totalGeneral = (order.totalPrice || 0) + (order.shippingCost || 0);
        const resteAPayer = totalGeneral - (order.advance || 0);

        const html = `
            <div class="space-y-4">
                <!-- Carte statut et progression -->
                <div class="bg-white p-5 rounded-2xl shadow-figma-md border border-slate-100">
                    <div class="flex justify-between items-center mb-3">
                        <div>
                            <span class="text-[10px] text-slate-400">Commande</span>
                            <p class="text-xl font-bold font-mono text-figma-dark">${order.id}</p>
                        </div>
                        <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-[10px] font-bold ${globalStatusBadge} border">
                            <i class="fa-solid ${statusIcon} text-[9px]"></i> ${globalStatusText}
                        </span>
                    </div>
                    <div class="mb-3">
                        <div class="flex justify-between text-[10px] text-slate-500 mb-1">
                            <span>Progression</span>
                            <span>${stepPercent}%</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-1.5">
                            <div class="gradient-bg h-1.5 rounded-full transition-all duration-500" style="width: ${stepPercent}%"></div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 pt-2 text-[11px]">
                        <div><span class="text-slate-400">Client:</span> <strong>${escapeHtml(order.clientName)}</strong></div>
                        <div><span class="text-slate-400">Livraison:</span> ${formatShortDate(deliveryDate)}</div>
                        <div><span class="text-slate-400">Zone:</span> ${order.deliveryZone}</div>
                        <div><span class="text-slate-400">Commande:</span> ${formatShortDate(orderDate)}</div>
                    </div>
                </div>

                <!-- Timeline -->
                <div class="bg-white p-5 rounded-2xl shadow-figma-md border border-slate-100">
                    <h3 class="text-sm font-extrabold text-figma-dark mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-timeline text-indigo-500 text-xs"></i> Avancement
                    </h3>
                    ${timelineHtml}
                </div>

                <!-- Articles -->
                <div class="bg-white p-5 rounded-2xl shadow-figma-md border border-slate-100">
                    <h3 class="text-sm font-extrabold text-figma-dark mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-bag-shopping text-amber-500 text-xs"></i> Articles (${visibleItems.length})
                    </h3>
                    <div class="divide-y divide-slate-100">
                        ${itemsHtml}
                    </div>
                </div>

                <!-- Récapitulatif -->
                <div class="bg-white p-5 rounded-2xl shadow-figma-md border border-slate-100">
                    <h3 class="text-sm font-extrabold text-figma-dark mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-receipt text-figma-purple text-xs"></i> Récapitulatif
                    </h3>
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between text-slate-600 text-[13px]">
                            <span>Sous-total</span>
                            <span class="font-medium">${(order.totalPrice || 0).toLocaleString()} Ar</span>
                        </div>
                        <div class="flex justify-between text-slate-600 text-[13px]">
                            <span>Livraison</span>
                            <span class="font-medium text-teal-600">${(order.shippingCost || 0).toLocaleString()} Ar</span>
                        </div>
                        <div class="flex justify-between font-extrabold text-figma-dark pt-2 border-t border-slate-100 text-[15px]">
                            <span>TOTAL</span>
                            <span class="gradient-text">${totalGeneral.toLocaleString()} Ar</span>
                        </div>
                        <div class="flex justify-between text-red-500 text-[13px] pt-1">
                            <span>Acompte</span>
                            <span class="font-semibold">- ${(order.advance || 0).toLocaleString()} Ar</span>
                        </div>
                        <div class="flex justify-between text-lg font-extrabold text-indigo-700 pt-2 border-t border-dashed border-slate-200">
                            <span>RESTANT DÛ</span>
                            <span>${resteAPayer.toLocaleString()} Ar</span>
                        </div>
                    </div>
                </div>

                <!-- Support -->
                <div class="medical-gradient p-4 rounded-2xl text-white shadow-lg shadow-teal-500/20 relative overflow-hidden">
                    <div class="absolute right-0 bottom-0 translate-x-4 translate-y-4 opacity-10 text-5xl">
                        <i class="fa-solid fa-headset"></i>
                    </div>
                    <h4 class="font-extrabold text-sm mb-1">Besoin d'aide ?</h4>
                    <p class="text-[11px] text-white/80 mb-3">Notre équipe est disponible 24/7</p>
                    <a href="#" class="inline-block bg-white text-indigo-600 text-[11px] font-bold px-4 py-2 rounded-xl shadow-sm">
                        <i class="fa-brands fa-whatsapp mr-1"></i> Contacter
                    </a>
                </div>

                <!-- Bouton retour -->
                <button id="backToSearchBtn" class="w-full py-3 bg-white border-2 border-slate-200 rounded-xl font-semibold text-slate-600 hover:border-indigo-400 hover:text-indigo-600 transition-all flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-arrow-left"></i> Autre commande
                </button>
            </div>
        `;

        container.innerHTML = html;

        const backBtn = document.getElementById('backToSearchBtn');
        if (backBtn) {
            backBtn.addEventListener('click', () => {
                document.getElementById('searchSection').classList.remove('hidden');
                document.getElementById('resultContainer').classList.add('hidden');
                document.getElementById('orderIdInput').value = '';
                document.getElementById('orderIdInput').focus();
                // Forcer le scroll en haut
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
        
        // S'assurer que la page peut défiler après chargement
        window.scrollTo({ top: 0, behavior: 'instant' });
    }

    document.getElementById('searchBtn').addEventListener('click', performSearch);
    document.getElementById('orderIdInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') performSearch();
    });

    loadData();
</script>
</body>
</html>
