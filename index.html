<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Suivi de commande - Aniel Medical SHOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: { figma: { purple: '#6366F1', pink: '#EC4899', coral: '#F43F5E', amber: '#F59E0B', mint: '#10B981', blue: '#3B82F6', dark: '#0F172A', light: '#F8FAFC', teal: '#14B8A6' } },
                    boxShadow: { 'figma-sm': '0 2px 8px rgba(0,0,0,0.04)', 'figma-md': '0 12px 34px rgba(99,102,241,0.06)', 'premium': '0 25px 50px -12px rgba(0,0,0,0.15)' }
                }
            }
        }
    </script>
    <style>
        body { background: linear-gradient(145deg, #F8FAFC 0%, #EFF3F8 100%); min-height: 100vh; }
        .gradient-text { background: linear-gradient(135deg, #6366F1 0%, #EC4899 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gradient-bg { background: linear-gradient(135deg, #6366F1 0%, #EC4899 100%); }
        .medical-gradient { background: linear-gradient(135deg, #0F766E 0%, #6366F1 100%); }
        .card-hover { transition: all 0.3s; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 25px 40px -12px rgba(0,0,0,0.15); }
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        .fade-slide { animation: fadeSlideUp 0.5s ease-out; }
        .timeline-container { display: flex; align-items: center; justify-content: center; }
        .timeline-step { display: flex; flex-direction: column; align-items: center; }
        .timeline-dot { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .timeline-line { height: 3px; width: 40px; border-radius: 3px; margin: 0 -2px; align-self: center; margin-bottom: 24px; }
        .timeline-label { font-size: 10px; font-weight: 700; margin-top: 8px; white-space: nowrap; }
        @media (min-width: 640px) { .timeline-dot { width: 52px; height: 52px; } .timeline-line { width: 60px; } .timeline-label { font-size: 11px; } }
        @media (min-width: 768px) { .timeline-line { width: 80px; } .timeline-label { font-size: 12px; } }
    </style>
</head>
<body class="font-sans text-slate-800 antialiased p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="bg-white/80 backdrop-blur-sm p-6 rounded-3xl shadow-figma-md border mb-8 card-hover">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 rounded-2xl medical-gradient flex items-center justify-center text-white text-2xl shadow-lg"><i class="fa-solid fa-capsules"></i></div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-extrabold">Aniel Medical <span class="gradient-text">SHOP</span></h1>
                    <p class="text-xs text-slate-400 mt-1">Suivez votre commande en temps réel</p>
                </div>
            </div>
        </header>

        <div id="searchSection">
            <div class="bg-white/90 backdrop-blur-sm p-8 md:p-10 rounded-3xl shadow-premium border text-center max-w-2xl mx-auto card-hover">
                <div class="w-24 h-24 rounded-3xl medical-gradient flex items-center justify-center mx-auto mb-5 shadow-xl"><i class="fa-solid fa-magnifying-glass text-white text-3xl"></i></div>
                <h2 class="text-3xl font-extrabold mb-3">Suivi de commande</h2>
                <p class="text-slate-500 text-sm mb-7">Entrez votre numéro de commande</p>
                <div class="flex flex-col sm:flex-row gap-3 max-w-md mx-auto">
                    <input type="text" id="orderIdInput" class="flex-1 px-5 py-3.5 rounded-xl border-2 border-slate-200 focus:border-indigo-400 text-center font-mono text-base" placeholder="Ex: art28" autocomplete="off">
                    <button id="searchBtn" class="gradient-bg text-white px-7 py-3.5 rounded-xl font-bold shadow-lg flex items-center gap-2"><i class="fa-solid fa-truck-fast"></i> Suivre</button>
                </div>
                <div id="errorMsg" class="text-red-500 text-sm mt-3 hidden bg-red-50 p-3 rounded-xl"></div>
                <div id="loadingMsg" class="text-indigo-600 text-sm mt-3 hidden items-center gap-2"><div class="w-5 h-5 border-2 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div> Recherche...</div>
            </div>
        </div>

        <div id="resultContainer" class="hidden fade-slide"></div>

        <footer class="mt-12 text-center text-xs text-slate-400 pb-8">
            <p>© 2026 Aniel Medical SHOP</p>
            <p class="mt-1">Besoin d'aide ? <a href="https://www.facebook.com/profile.php?id=61587421085556" class="underline hover:text-indigo-500">Facebook</a> | <a href="https://wa.me/261343604545" class="underline hover:text-indigo-500">WhatsApp : 034 36 045 45</a></p>
        </footer>
    </div>

    <script>
        // URL PERMANENTE du Gist (sans hash, pointe toujours vers la dernière version)
        const DATA_URL = "https://gist.githubusercontent.com/SamuelRaiane/9fc099c832113b7764b85dc4e189a008/raw/aniel_db.json";
        let orders = [];

        async function loadData() {
            try {
                const url = DATA_URL + "?t=" + Date.now();
                const response = await fetch(url);
                if (!response.ok) throw new Error("HTTP " + response.status);
                orders = JSON.parse(await response.text()).orders || [];
                return true;
            } catch(e) { console.error(e); return false; }
        }

        function formatDate(d) { return d ? new Date(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : 'Non spécifiée'; }
        function esc(s) { return s ? s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])) : ''; }

        async function performSearch() {
            const orderId = document.getElementById('orderIdInput').value.trim();
            const err = document.getElementById('errorMsg');
            const load = document.getElementById('loadingMsg');
            err.classList.add('hidden');
            document.getElementById('resultContainer').classList.add('hidden');
            if (!orderId) { err.textContent = "Entrez un numéro"; err.classList.remove('hidden'); return; }
            load.classList.remove('hidden'); load.classList.add('flex');
            if (!await loadData()) { load.classList.remove('flex'); load.classList.add('hidden'); err.textContent = "Service indisponible."; err.classList.remove('hidden'); return; }
            load.classList.remove('flex'); load.classList.add('hidden');
            const order = orders.find(o => o.id.toLowerCase() === orderId.toLowerCase());
            if (!order) { err.textContent = "Commande introuvable."; err.classList.remove('hidden'); return; }
            document.getElementById('searchSection').classList.add('hidden');
            document.getElementById('resultContainer').classList.remove('hidden');
            showOrder(order);
        }

        function showOrder(order) {
            const items = order.items.filter(i => !i.hidden);
            const livré = items.every(i => i.status === "livré");
            const récupéré = items.every(i => i.status === "récupéré");
            const done = livré || récupéré;
            const transit = items.some(i => i.status === "en livraison");
            const ready = items.some(i => i.status === "prêt à livrer" || i.status === "prêt à récupérer");

            const steps = [
                { n: "Confirmée", ok: true },
                { n: "Préparée", ok: ready || transit || done },
                { n: "En transit", ok: transit || done, act: transit && !done },
                { n: récupéré ? "Récupérée" : "Livrée", ok: done }
            ];

            let timeline = '<div class="timeline-container">';
            steps.forEach((s, i) => {
                let dot = s.ok ? 'bg-emerald-500 text-white' : s.act ? 'bg-indigo-600 text-white ring-4 ring-indigo-200' : 'bg-slate-200 text-slate-400';
                let icon = s.ok ? '<i class="fa-solid fa-check text-xs"></i>' : s.act ? '<i class="fa-solid fa-ellipsis text-xs"></i>' : '<i class="fa-regular fa-circle text-xs"></i>';
                let line = s.ok ? 'bg-emerald-500' : 'bg-slate-200';
                timeline += `<div class="timeline-step"><div class="timeline-dot ${dot}">${icon}</div><div class="timeline-label ${s.ok?'text-slate-700':s.act?'text-indigo-600 font-extrabold':'text-slate-400'}">${s.n}</div></div>`;
                if (i < steps.length - 1) timeline += `<div class="timeline-line ${line}"></div>`;
            });
            timeline += '</div>';

            let itemsHtml = '';
            items.forEach((it, idx) => {
                itemsHtml += `
                    <div class="p-5 rounded-2xl bg-slate-50/50 border border-slate-100">
                        <div class="flex items-center gap-2 mb-3"><span class="w-7 h-7 rounded-full gradient-bg text-white text-xs font-bold flex items-center justify-center">${idx+1}</span><span class="font-extrabold text-slate-800">${it.quantity}x ${it.productType||'Article'} - Taille ${it.size}</span></div>
                        <div class="grid grid-cols-2 gap-2 text-sm">
                            <div><span class="text-slate-400 text-xs">Tissu</span><br><span class="font-semibold">${it.fabricType||'-'}</span></div>
                            <div><span class="text-slate-400 text-xs">Couleur</span><br><span class="font-semibold">${it.color||'-'}</span></div>
                            <div><span class="text-slate-400 text-xs">Style</span><br><span class="font-semibold">${it.style||'-'}</span></div>
                        </div>
                        ${it.persoText ? `<div class="mt-2 p-2 bg-indigo-50 rounded-xl text-sm"><span class="font-semibold text-indigo-600">Broderie:</span> ${esc(it.persoText)}</div>` : ''}
                        <div class="flex gap-4 mt-2 pt-2 border-t text-sm">
                            <span>Couture: <strong>${it.coutureStatus==='terminé'?'✅ Terminé':it.coutureStatus==='en cours'?'🔵 En cours':'⏳ À faire'}</strong></span>
                            ${it.broderieStatus?`<span>Broderie: <strong>${it.broderieStatus==='terminé'?'✅ Terminé':'🔵 En cours'}</strong></span>`:''}
                        </div>
                    </div>`;
            });

            const total = (order.totalPrice||0) + (order.shippingCost||0);
            const reste = total - (order.advance||0);

            document.getElementById('resultContainer').innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 space-y-6">
                        <div class="bg-white p-6 rounded-3xl shadow-figma-md border">
                            <div class="flex justify-between items-center gap-4 mb-6">
                                <div><p class="text-xs font-bold uppercase text-slate-400">Livraison estimée</p><p class="text-2xl font-extrabold">${formatDate(order.dueDate)} ${order.dueTime!=='aucun'?'· '+order.dueTime:''}</p></div>
                                <div class="px-4 py-2 rounded-xl bg-indigo-50"><p class="text-sm font-bold"><i class="fa-solid fa-location-dot text-teal-500 mr-1"></i>${order.deliveryZone} ${order.deliveryPlace||''}</p></div>
                            </div>
                            ${timeline}
                        </div>
                        <div class="bg-white p-6 rounded-3xl shadow-figma-md border">
                            <h3 class="text-lg font-extrabold mb-4">Détails</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
                                <div><span class="text-slate-400">ID:</span> <span class="font-mono font-bold">${order.id}</span></div>
                                <div><span class="text-slate-400">Client:</span> <span class="font-bold">${esc(order.clientName)}</span></div>
                                <div><span class="text-slate-400">Commandé le:</span> ${formatDate(order.orderDate)}</div>
                                <div><span class="text-slate-400">Livraison:</span> ${formatDate(order.dueDate)} ${order.dueTime!=='aucun'?order.dueTime:''}</div>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-3xl shadow-figma-md border">
                            <h3 class="text-lg font-extrabold mb-4">Articles <span class="text-sm bg-slate-100 px-2 py-0.5 rounded-full">${items.length}</span></h3>
                            <div class="space-y-3">${itemsHtml}</div>
                        </div>
                    </div>
                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-3xl shadow-figma-md border">
                            <h3 class="text-lg font-extrabold mb-4">Récapitulatif</h3>
                            <div class="space-y-2 text-sm">
                                <div class="flex justify-between py-2 border-b"><span>Articles</span><span class="font-bold">${(order.totalPrice||0).toLocaleString()} Ar</span></div>
                                <div class="flex justify-between py-2 border-b"><span>Livraison</span><span class="font-bold text-teal-600">${(order.shippingCost||0).toLocaleString()} Ar</span></div>
                                <div class="flex justify-between py-3 text-base font-extrabold"><span>TOTAL</span><span class="gradient-text text-xl">${total.toLocaleString()} Ar</span></div>
                                <div class="flex justify-between py-2 bg-red-50 rounded-xl px-3"><span class="text-red-600">Acompte</span><span class="text-red-600 font-bold">- ${(order.advance||0).toLocaleString()} Ar</span></div>
                                <div class="flex justify-between py-3 text-lg font-extrabold text-indigo-700 border-t-2 border-indigo-200"><span>RESTE À PAYER</span><span>${reste.toLocaleString()} Ar</span></div>
                            </div>
                        </div>
                        <div class="medical-gradient p-6 rounded-3xl text-white shadow-xl relative overflow-hidden">
                            <h4 class="font-extrabold text-xl mb-2">Besoin d'assistance ?</h4>
                            <div class="flex flex-wrap gap-2">
                                <a href="https://www.facebook.com/profile.php?id=61587421085556" target="_blank" class="bg-white/20 text-white text-xs font-bold px-4 py-2.5 rounded-xl"><i class="fa-brands fa-facebook"></i> Facebook</a>
                                <a href="https://wa.me/261343604545" target="_blank" class="bg-white/20 text-white text-xs font-bold px-4 py-2.5 rounded-xl"><i class="fa-brands fa-whatsapp"></i> 034 36 045 45</a>
                            </div>
                        </div>
                        <button id="backToSearchBtn" class="w-full py-3.5 bg-white border-2 border-slate-200 rounded-xl font-bold"><i class="fa-solid fa-arrow-left mr-2"></i>Autre commande</button>
                    </div>
                </div>`;
            document.getElementById('backToSearchBtn').addEventListener('click', () => {
                document.getElementById('searchSection').classList.remove('hidden');
                document.getElementById('resultContainer').classList.add('hidden');
                document.getElementById('orderIdInput').value = '';
                document.getElementById('orderIdInput').focus();
            });
        }

        document.getElementById('searchBtn').addEventListener('click', performSearch);
        document.getElementById('orderIdInput').addEventListener('keypress', e => { if(e.key==='Enter') performSearch(); });
    </script>
</body>
</html>
